services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: purple_assignment
      POSTGRES_USER: purple
      POSTGRES_PASSWORD: purple
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purple -d purple_assignment"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
