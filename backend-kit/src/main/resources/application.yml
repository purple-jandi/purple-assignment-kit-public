spring:
  application:
    name: purple-assignment-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/purple_assignment}
    username: ${DB_USERNAME:purple}
    password: ${DB_PASSWORD:purple}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
