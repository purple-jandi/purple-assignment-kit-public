name: flutter_kit
description: "A new Flutter boilerplate project for hiring tasks."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  go_router: ^16.2.5
  flutter_svg: ^2.2.1
  gap: ^3.0.1
  logger: ^2.6.2
  riverpod_annotation: ^3.0.3
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^3.0.3
  freezed: ^3.2.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
